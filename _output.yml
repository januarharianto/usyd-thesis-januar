bookdown::gitbook:
  css: style.css
  config:
    toc:
      collapse: subsection
      scroll_highlight: yes
      before: null
      after: null
    toolbar:
      position: fixed
    edit : null
    download: ["pdf"]
    search: yes
    fontsettings:
      theme: white
      family: sans
      size: 2
    sharing:
      facebook: no
      twitter: no
      google: no
      linkedin: no
      weibo: no
      instapper: no
      vk: no
      all: no


bookdown::pdf_book:
  includes:
    in_header:
      - settings.tex
      - preamble.tex
    before_body:
      - 001_frontpage.tex
      - 002_abstract.tex
      - 003_acknowledgements.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes



#bookdown::epub_book: default


bookdown::word_document2:
  fig_caption: true
  reference_docx: template.docx


