bookdown::gitbook:
  css: style.css
  pandoc_args: [ "--csl", "marine-biology.csl"]
  config:
    toc:
      collapse: subsection
      scroll_highlight: yes
      before: null
      after: null
    toolbar:
      position: fixed
    edit : null
    download: ["pdf"]
    search: yes
    fontsettings:
      theme: white
      family: sans
      size: 2
    sharing:
      facebook: no
      twitter: no
      google: no
      linkedin: no
      weibo: no
      instapper: no
      vk: no
      all: no


bookdown::pdf_book:
  includes:
    in_header:
      - settings.tex
      - 000_preamble.tex
    before_body:
      - 001_frontpage.tex
      - 002_statement.tex
      - 003_abstract.tex
      - 004_acknowledgements.tex
      - 005_preface.tex
  latex_engine: xelatex
  citation_package: none
  pandoc_args: [ "--csl", "marine-biology.csl"]
  keep_tex: yes



